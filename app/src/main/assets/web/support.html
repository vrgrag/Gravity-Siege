<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support</title>
    <style>
        body {
            margin: 0;
            padding: 24px 16px 32px;
            background: #ffffff;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1a1a1a;
        }
        .support-container {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e6e6e6;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 32px 28px 24px;
        }
        .support-title {
            font-size: 1.6em;
            color: #1e7fbf;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 700;
        }
        .support-desc {
            color: #555555;
            font-size: 1em;
            margin-bottom: 18px;
            text-align: center;
            line-height: 1.5;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #1e7fbf;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #bcdffb;
            border-radius: 8px;
            font-size: 1em;
            background: #f7fbff;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            border-color: #1e7fbf;
            outline: none;
        }
        .support-btn {
            width: 100%;
            background: linear-gradient(90deg, #1e7fbf 0%, #4fc3f7 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: 600;
        }
        .support-success {
            display: none;
            color: #1e7fbf;
            background: #e3f7e7;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="support-container">
        <div class="support-title">Support for Gravity Siege</div>
        <div class="support-desc">
            Please fill out the form below to ask a question or submit a request.
        </div>
        <form id="supportForm">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Your email" />
            <label for="question">Question</label>
            <textarea id="question" name="question" rows="4" required placeholder="Describe your question..."></textarea>
            <button type="submit" class="support-btn">Send</button>
        </form>
        <div class="support-success" id="supportSuccess">Your request has been sent!</div>
    </div>
    <script>
        document.getElementById("supportForm").addEventListener("submit", function (event) {
            event.preventDefault();
            document.getElementById("supportSuccess").style.display = "block";
            setTimeout(function () {
                document.getElementById("supportSuccess").style.display = "none";
            }, 3500);
            document.getElementById("supportForm").reset();
        });
    </script>
</body>
</html>
